<script>
// Almacenamiento compartido: el histórico vive en el KV del Worker (/kv), igual que el resto de Admin Hub.
// Se mantiene la interfaz window.storage.get/set para no tocar el código de la app.
const WORKER_URL = 'https://lucky-shadow-44ed.veronica-zueras.workers.dev';
const KV_KEY = 'adminhub_bajas_comisiones_v1';
const LOCAL_KEY = 'comisiones-db-v3'; // clave antigua en localStorage (solo para migrar datos existentes una vez)
// Destino del botón "Volver a Bajas Comisiones" (relativo: la pantalla de Comisiones, en la misma carpeta)
const HUB_URL = 'index.html';
// Fusiona lo que hay en el KV con lo que acabamos de cambiar en esta pantalla, para no pisar lo de otra persona
function mergeDb(r, l) {
  r = r || {};
  const out = { ...r, ...l };
  out.advisors = { ...(r.advisors || {}) };
  for (const [c, a] of Object.entries(l.advisors || {})) {
    const ra = out.advisors[c];
    out.advisors[c] = ra ? { ...ra, ...a, records: { ...ra.records, ...a.records } } : a;
  }
  const bm = new Map();
  (r.bajas || []).forEach((b) => bm.set(b.id, b));
  (l.bajas || []).forEach((b) => bm.set(b.id, b));
  out.bajas = Array.from(bm.values());
  out.aplicaOverrides = { ...(r.aplicaOverrides || {}) };
  for (const [id, o] of Object.entries(l.aplicaOverrides || {})) out.aplicaOverrides[id] = { ...(out.aplicaOverrides[id] || {}), ...o };
  out.aliases = { ...(r.aliases || {}), ...(l.aliases || {}) };
  return out;
}

// Lee el valor actual del KV (como texto JSON) o null si está vacío
async function kvRead() {
  const res = await fetch(`${WORKER_URL}/kv?key=${encodeURIComponent(KV_KEY)}`);
  if (!res.ok) throw new Error('kv get failed');
  const d = await res.json();
  if (!d || !d.value) return null;
  return typeof d.value === 'string' ? d.value : JSON.stringify(d.value);
}

window.storage = {
  async get(key) {
    const cur = await kvRead();
    if (cur) return { key, value: cur };

    // KV vacío: si este navegador tenía datos guardados en local, se suben al KV (migración única)
    let local = null;
    try { local = localStorage.getItem(LOCAL_KEY); } catch (e) {}
    if (local) {
      try { await this.set(key, local); } catch (e) {}
      return { key, value: local };
    }
    return null;
  },
  async set(key, value, shared, force) {
    let out = JSON.parse(value);
    if (!force) {
      // lectura fresca antes de escribir: si falla, no se escribe a ciegas
      const cur = await kvRead();
      if (cur) out = mergeDb(JSON.parse(cur), out);
    }
    const res = await fetch(`${WORKER_URL}/kv`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KV_KEY, value: out })
    });
    if (!res.ok) throw new Error('kv set failed');
    return { key, value: JSON.stringify(out) };
  },
};
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- helpers ----------
const STOPWORDS = new Set(["de", "del", "la", "las", "los", "y", "san", "santa"]);

const normalize = (s) =>
  String(s ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();

const CODE_RE = /^\d{4,}$/;

function tokenize(name) {
  return normalize(name)
    .replace(/,/g, " ")
    .split(/[^a-z0-9]+/)
    .filter((t) => t && !STOPWORDS.has(t));
}

function parseTramo(raw) {
  if (raw === null || raw === undefined || raw === "") return null;
  if (typeof raw === "number") return raw <= 1 ? raw * 100 : raw;
  const s = String(raw).replace("%", "").replace(",", ".").trim();
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function parseNumber(raw) {
  if (raw === null || raw === undefined || raw === "") return null;
  if (typeof raw === "number") return raw;
  const s = String(raw)
    .replace(/€/g, "")
    .replace(/\s/g, "")
    .replace(/\.(?=\d{3}(?:\D|$))/g, "")
    .replace(",", ".")
    .trim();
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function findHeaderRow(rows, requiredIncludes) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const norm = rows[i].map(normalize);
    const ok = requiredIncludes.every((req) => norm.some((c) => req(c)));
    if (ok) return i;
  }
  return -1;
}

function findCol(headerNorm, matcher) {
  for (let i = 0; i < headerNorm.length; i++) {
    if (matcher(headerNorm[i])) return i;
  }
  return -1;
}

function tramoColor(v) {
  if (v === null || v === undefined) return "#41556E";
  const t = Math.max(0, Math.min(1, v / 5));
  const c1 = [86, 132, 163];
  const c2 = [255, 61, 138];
  const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
  const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
  const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
  return `rgb(${r},${g},${b})`;
}

function fmtMes(mes) {
  if (!mes) return "—";
  const m = String(mes).match(/^(\d{4})-(\d{2})$/);
  if (!m) return mes;
  const names = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
  const idx = parseInt(m[2], 10) - 1;
  return `${names[idx] || m[2]} ${m[1]}`;
}

const MONTH_NAME_MAP = {
  enero: "01", ene: "01",
  febrero: "02", feb: "02",
  marzo: "03", mar: "03",
  abril: "04", abr: "04",
  mayo: "05", may: "05",
  junio: "06", jun: "06",
  julio: "07", jul: "07",
  agosto: "08", ago: "08",
  septiembre: "09", setiembre: "09", sep: "09", sept: "09",
  octubre: "10", oct: "10",
  noviembre: "11", nov: "11",
  diciembre: "12", dic: "12",
};

function parseMesFromFileName(fileName) {
  if (!fileName) return null;
  const base = fileName.replace(/\.[^.]+$/, "");
  let m = base.match(/(20\d{2})[-_\/\.\s]?(0[1-9]|1[0-2])(?!\d)/);
  if (m) return `${m[1]}-${m[2]}`;
  m = base.match(/(0[1-9]|1[0-2])[-_\/\.\s](20\d{2})/);
  if (m) return `${m[2]}-${m[1]}`;
  const norm = normalize(base);
  for (const [name, num] of Object.entries(MONTH_NAME_MAP)) {
    const re = new RegExp(`(^|[^a-z])${name}($|[^a-z])`);
    if (re.test(norm)) {
      const y = norm.match(/20\d{2}/);
      if (y) return `${y[0]}-${num}`;
    }
  }
  return null;
}

function fmtEUR(n) {
  if (n === null || n === undefined) return "—";
  return n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}

function fmtNum(n) {
  if (n === null || n === undefined) return "—";
  return n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtEURShort(n) {
  if (n === null || n === undefined) return "—";
  if (Math.abs(n) >= 1000) return (n / 1000).toLocaleString("es-ES", { maximumFractionDigits: 1 }) + " mil €";
  return fmtEUR(n);
}

// best-match a free-text name against known advisors (used for asesor / jefe / director)
function matchPerson(advisors, freeName, equipoHint) {
  const nameTokens = tokenize(freeName);
  if (nameTokens.length === 0) return null;
  let best = null;
  let bestScore = -1;
  for (const a of Object.values(advisors)) {
    const aTokens = new Set(tokenize(a.nombre));
    const allFound = nameTokens.every((t) => aTokens.has(t));
    if (!allFound) continue;
    let score = nameTokens.length;
    if (equipoHint && a.equipo && normalize(a.equipo) === normalize(equipoHint)) score += 2;
    if (score > bestScore) {
      bestScore = score;
      best = a.codigo;
    }
  }
  return best;
}

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return "gen-" + Math.abs(h).toString(36);
}

const STORAGE_KEY = "comisiones-db-v3";
const RESET_PASSWORD = "AdminHub";
const emptyDb = { advisors: {}, bajas: [], aplicaOverrides: {}, aliases: {}, lastUpdate: null };

function SummaryCard({ title, color, panelStyle, items }) {
  const [open, setOpen] = useState(false);
  const subtotal = items.reduce((s, x) => s + x.total, 0);
  return (
    <div style={{ ...panelStyle, flex: "1 1 260px" }}>
      <div style={styles.panelHead}>
        <span style={styles.dot(color)} />
        <span style={{ ...styles.panelHeadText, color }}>{title}</span>
        <span style={styles.panelHeadCount}>{items.length}</span>
      </div>
      <div style={{ padding: "0 20px 14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div>
          <div style={styles.kpiLabel}>SUBTOTAL</div>
          <div style={{ ...styles.kpiValue, fontSize: 22, color }}>{fmtEUR(subtotal)}</div>
        </div>
        <button style={{ ...styles.toggleBtn, color, borderColor: color }} onClick={() => setOpen((v) => !v)}>
          {open ? "Ocultar detalle ▴" : "Ver detalle ▾"}
        </button>
      </div>
      {open && (
        <div style={{ padding: "0 20px 16px 20px" }}>
          {items.length === 0 && <div style={styles.emptyHint}>Sin datos.</div>}
          {items.map((x) => (
            <div key={x.nombre} style={styles.summaryRow}>
              <span>{x.nombre}</span>
              <span style={{ color, fontWeight: 700 }}>{fmtEUR(x.total)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [db, setDb] = useState(emptyDb);
  const [ready, setReady] = useState(false);
  const [search, setSearch] = useState("");
  const [equipoFilter, setEquipoFilter] = useState("Todos");
  const [mesFilter, setMesFilter] = useState("Todos");
  const [fallbackMonth, setFallbackMonth] = useState("");
  const [status, setStatus] = useState(null);
  const [bajasStatus, setBajasStatus] = useState(null);
  const [busy, setBusy] = useState(false);
  const [showUnmatched, setShowUnmatched] = useState(true);
  const [assignInputs, setAssignInputs] = useState({});
  const [tipologiaFilter, setTipologiaFilter] = useState("");
  const [motivoFilter, setMotivoFilter] = useState("");
  const DEFAULT_COLW = [12, 7, 7, 9, 5, 9, 12, 5, 9, 11, 5, 9];
  const [colW, setColW] = useState(() => {
    try {
      const v = JSON.parse(localStorage.getItem("comisiones-colw") || "null");
      if (Array.isArray(v) && v.length === 12) return v;
    } catch (e) {}
    return DEFAULT_COLW;
  });
  const colWRef = useRef(colW);
  const tableRef = useRef(null);
  const [showTramos, setShowTramos] = useState(false);
  const fileRef = useRef(null);
  const bajasFileRef = useRef(null);
  const loadFailedRef = useRef(false);

  useEffect(() => {
    async function load(first) {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) setDb({ ...emptyDb, ...JSON.parse(res.value) });
        loadFailedRef.current = false;
      } catch (e) {
        if (first) {
          loadFailedRef.current = true;
          setStatus({ type: "error", text: "No se pudo cargar el histórico compartido. Recarga la página antes de subir nada." });
        }
      } finally {
        if (first) setReady(true);
      }
    }
    load(true);
    // al volver a la pestaña se refrescan los datos, por si otra persona ha subido algo entretanto
    const onFocus = () => load(false);
    window.addEventListener("focus", onFocus);
    return () => window.removeEventListener("focus", onFocus);
  }, []);

  async function persist(newDb, force) {
    if (loadFailedRef.current) {
      setStatus({ type: "error", text: "No se guarda: el histórico compartido no se cargó. Recarga la página." });
      return;
    }
    const withStamp = { ...newDb, lastUpdate: new Date().toISOString() };
    setDb(withStamp);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(withStamp), false, force);
      setDb({ ...emptyDb, ...JSON.parse(res.value) });
    } catch (e) {
      setStatus({ type: "error", text: "No se pudo guardar. Inténtalo de nuevo." });
    }
  }

  // ---------- upload tramos ----------
  function handleTramosFile(file) {
    if (!file) return;
    setBusy(true);
    setStatus(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        let addedRows = 0;
        const monthsSeen = new Set();
        const newDb = { ...db, advisors: { ...db.advisors } };

        wb.SheetNames.forEach((sheetName) => {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });
          const headerIdx = findHeaderRow(rows, [(c) => c.includes("codigo"), (c) => c.includes("nombre")]);
          if (headerIdx === -1) return;
          const headerNorm = rows[headerIdx].map(normalize);

          const idx = {
            codigo: findCol(headerNorm, (h) => h.includes("codigo")),
            nombre: findCol(headerNorm, (h) => h.includes("nombre")),
            equipo: findCol(headerNorm, (h) => h === "equipo"),
            categoria: findCol(headerNorm, (h) => h.includes("categoria")),
            tramo: findCol(headerNorm, (h) => h.includes("tramo")),
            totalPuntos: findCol(headerNorm, (h) => h.includes("total") && h.includes("punto")),
            factNeta: findCol(headerNorm, (h) => h.includes("fact")),
            matriculas: findCol(headerNorm, (h) => h.includes("matricul")),
            mes: findCol(headerNorm, (h) => h.includes("mes")),
          };
          if (idx.codigo === -1 || idx.nombre === -1) return;

          for (let r = headerIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            const codigoRaw = String(row[idx.codigo] ?? "").trim();
            const nombreRaw = String(row[idx.nombre] ?? "").trim();
            if (!CODE_RE.test(codigoRaw) || !nombreRaw) continue;

            const mes = idx.mes !== -1 && row[idx.mes] ? String(row[idx.mes]).trim() : fallbackMonth;
            if (!mes) continue;
            monthsSeen.add(mes);

            const record = {
              mes,
              categoria: idx.categoria !== -1 ? String(row[idx.categoria] ?? "").trim() : "",
              equipo: idx.equipo !== -1 ? String(row[idx.equipo] ?? "").trim() : "",
              totalPuntos: idx.totalPuntos !== -1 ? parseNumber(row[idx.totalPuntos]) : null,
              factNeta: idx.factNeta !== -1 ? parseNumber(row[idx.factNeta]) : null,
              matriculas: idx.matriculas !== -1 ? parseNumber(row[idx.matriculas]) : null,
              tramo: idx.tramo !== -1 ? parseTramo(row[idx.tramo]) : null,
            };

            if (!newDb.advisors[codigoRaw]) {
              newDb.advisors[codigoRaw] = { codigo: codigoRaw, nombre: nombreRaw, equipo: record.equipo, categoria: record.categoria, records: {} };
            } else {
              newDb.advisors[codigoRaw] = { ...newDb.advisors[codigoRaw], records: { ...newDb.advisors[codigoRaw].records } };
              if (nombreRaw) newDb.advisors[codigoRaw].nombre = nombreRaw;
              if (record.equipo) newDb.advisors[codigoRaw].equipo = record.equipo;
              if (record.categoria) newDb.advisors[codigoRaw].categoria = record.categoria;
            }
            newDb.advisors[codigoRaw].records[mes] = record;
            addedRows++;
          }
        });

        if (addedRows === 0) {
          setStatus({ type: "error", text: "No se han encontrado filas válidas (columnas 'Código asesor' y 'Nombre')." });
        } else {
          persist(newDb);
          setStatus({ type: "ok", text: `${addedRows} registros cargados (${Array.from(monthsSeen).join(", ")}).` });
        }
      } catch (err) {
        setStatus({ type: "error", text: "No se pudo leer el archivo. ¿Es un .xlsx válido?" });
      } finally {
        setBusy(false);
        if (fileRef.current) fileRef.current.value = "";
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- upload bajas ----------
  function handleBajasFile(file) {
    if (!file) return;
    setBusy(true);
    setBajasStatus(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        let matchedCount = 0;
        let unmatchedCount = 0;
        let dupCount = 0;
        const existingIds = new Set((db.bajas || []).map((b) => b.id));
        const newBajas = [...(db.bajas || [])];
        const idxById = new Map(newBajas.map((x, i) => [x.id, i]));
        const fileMes = parseMesFromFileName(file.name);

        wb.SheetNames.forEach((sheetName) => {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });
          const headerIdx = findHeaderRow(rows, [(c) => c === "asesor", (c) => c.includes("facturacion")]);
          if (headerIdx === -1) return;
          const headerNorm = rows[headerIdx].map(normalize);

          const idx = {
            asesor: findCol(headerNorm, (h) => h === "asesor"),
            equipo: findCol(headerNorm, (h) => h === "equipo"),
            jefe: findCol(headerNorm, (h) => h.includes("jefe") && h.includes("equipo")),
            director: findCol(headerNorm, (h) => h.includes("director")),
            factNeta: findCol(headerNorm, (h) => h.includes("facturacion") && h.includes("neta")),
            mesComisiones: findCol(headerNorm, (h) => h.includes("mes") && h.includes("comision")),
            mesComercialBaja: findCol(headerNorm, (h) => h.includes("mes") && h.includes("comercial")),
            idOportunidad: findCol(headerNorm, (h) => h.includes("id") && h.includes("oportunidad")),
            motivo: findCol(headerNorm, (h) => h.includes("motivo")),
            tipologia: findCol(headerNorm, (h) => h.includes("tipologia") && h.includes("matricula")),
            alumno: findCol(headerNorm, (h) => h.includes("nombres") || (h.includes("nombre") && h.includes("apellido"))),
          };
          if (idx.asesor === -1 || idx.factNeta === -1) return;

          for (let r = headerIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            const asesorNombre = String(row[idx.asesor] ?? "").trim();
            if (!asesorNombre) continue;
            const factNeta = parseNumber(row[idx.factNeta]);
            if (factNeta === null) continue;
            const mesComisiones = idx.mesComisiones !== -1 && row[idx.mesComisiones] ? String(row[idx.mesComisiones]).trim() : fileMes || fallbackMonth;
            if (!mesComisiones) continue;
            const mesComercialBaja = idx.mesComercialBaja !== -1 && row[idx.mesComercialBaja] ? String(row[idx.mesComercialBaja]).trim() : mesComisiones;
            const equipo = idx.equipo !== -1 ? String(row[idx.equipo] ?? "").trim() : "";
            const jefeNombre = idx.jefe !== -1 ? String(row[idx.jefe] ?? "").trim() : "";
            const directorNombre = idx.director !== -1 ? String(row[idx.director] ?? "").trim() : "";
            const motivo = idx.motivo !== -1 ? String(row[idx.motivo] ?? "").trim() : "";
            const tipologia = idx.tipologia !== -1 ? String(row[idx.tipologia] ?? "").trim() : "";
            const alumno = idx.alumno !== -1 ? String(row[idx.alumno] ?? "").trim() : "";
            const idOportunidadRaw = idx.idOportunidad !== -1 ? String(row[idx.idOportunidad] ?? "").trim() : "";

            const id = idOportunidadRaw || simpleHash(`${asesorNombre}|${alumno}|${factNeta}|${mesComercialBaja}`);
            if (existingIds.has(id)) {
              dupCount++;
              const k = idxById.get(id);
              if (k !== undefined && (tipologia || motivo)) {
                newBajas[k] = { ...newBajas[k], tipologia: tipologia || newBajas[k].tipologia || "", motivo: motivo || newBajas[k].motivo || "" };
              }
              continue;
            }
            existingIds.add(id);

            const asesorCodigo = (db.aliases || {})[normalize(asesorNombre)] || matchPerson(db.advisors, asesorNombre, equipo);
            const jefeCodigo = jefeNombre ? matchPerson(db.advisors, jefeNombre, equipo) : null;
            const directorCodigo = directorNombre ? matchPerson(db.advisors, directorNombre, null) : null;

            if (!asesorCodigo) unmatchedCount++;
            else matchedCount++;

            idxById.set(id, newBajas.length);
            newBajas.push({
              id,
              idOportunidad: idOportunidadRaw || null,
              asesorNombre,
              asesorCodigo,
              equipo,
              jefeNombre: jefeNombre || null,
              jefeCodigo,
              directorNombre: directorNombre || null,
              directorCodigo,
              mesOrigen: mesComercialBaja,
              mesComisiones,
              factNeta,
              motivo,
              tipologia,
              alumno,
            });
          }
        });

        const newDb = { ...db, bajas: newBajas };

        if (matchedCount === 0 && unmatchedCount === 0 && dupCount === 0) {
          setBajasStatus({ type: "error", text: "No se han encontrado filas válidas (columnas 'ASESOR' y 'FACTURACIÓN NETA')." });
        } else {
          persist(newDb);
          let text = `${matchedCount} bajas emparejadas.`;
          if (unmatchedCount > 0) text += ` ${unmatchedCount} sin asesor identificado.`;
          if (dupCount > 0) text += ` ${dupCount} ya existían (omitidas).`;
          if (fileMes) text += ` Mes de comisión detectado en el archivo: ${fmtMes(fileMes)}.`;
          setBajasStatus({ type: unmatchedCount > 0 ? "warn" : "ok", text });
        }
      } catch (err) {
        setBajasStatus({ type: "error", text: "No se pudo leer el archivo. ¿Es un .xlsx válido?" });
      } finally {
        setBusy(false);
        if (bajasFileRef.current) bajasFileRef.current.value = "";
      }

  function assignAsesor(baja) {
    const text = (assignInputs[baja.id] || "").trim();

      return;

    const advisors = db.advisors || {};
    const nt = normalize(text);
    const exact = Object.values(advisors).find((a) => normalize(a.nombre) === nt);
    const codigo = exact ? exact.codigo : matchPerson(advisors, text, baja.equipo);
    if (!codigo || !advisors[codigo]) {
      setBajasStatus({ type: "error", text: `No se encontró "${text}" en el histórico de tramos. Elige un nombre de la lista.` });
      return;
    }
    const key = normalize(baja.asesorNombre);
    const newBajas = (db.bajas || []).map((b) => (!b.asesorCodigo && normalize(b.asesorNombre) === key ? { ...b, asesorCodigo: codigo } : b));
    const aliases = { ...(db.aliases || {}), [key]: codigo };
    persist({ ...db, bajas: newBajas, aliases });
    setAssignInputs({});
    setBajasStatus({ type: "ok", text: `"${baja.asesorNombre}" asignado a ${advisors[codigo].nombre}. Descuentos recalculados.` });

  function startResize(e, i) {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX;
    const tw = tableRef.current ? tableRef.current.getBoundingClientRect().width : 1000;
    const start = [...colWRef.current];
    const MIN = 3;
    function move(ev) {
      const dp = ((ev.clientX - startX) / tw) * 100;
      let a = start[i] + dp;
      let b = start[i + 1] - dp;
      if (a < MIN) { b -= MIN - a; a = MIN; }
      if (b < MIN) { a -= MIN - b; b = MIN; }
      const n = [...start];
      n[i] = a;
      n[i + 1] = b;
      colWRef.current = n;
      setColW(n);
    }
    function up() {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      try { localStorage.setItem("comisiones-colw", JSON.stringify(colWRef.current)); } catch (err) {}
    }
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  }

  function resetColW() {
    colWRef.current = DEFAULT_COLW;
    setColW(DEFAULT_COLW);
    try { localStorage.removeItem("comisiones-colw"); } catch (err) {}
  }

  function exportDesglose() {
    // Exporta TODAS las bajas cargadas, sin tener en cuenta los filtros de pantalla.
    const r2 = (n) => Math.round(n * 100) / 100;
    const todas = [...enrichedAll].sort((x, y) => x.asesorNombreFinal.localeCompare(y.asesorNombreFinal) || y.mesComisiones.localeCompare(x.mesComisiones));
    const header = [
      "Asesor", "TIPOLOGIA MATRICULA", "MOTIVO DE BAJA", "ID oportunidad", "Mes origen", "Fact. neta",
      "Tramo asesor (%)", "Desc. asesor",
      "Jefe de equipo", "Tramo jefe (%)", "Desc. jefe",
      "Director de ventas", "Tramo director (%)", "Desc. director",
    ];
    let tA = 0, tJ = 0, tD = 0;
    const rows = todas.map((b) => {
      const dA = b.descAsesor == null ? "" : b.aplicaAsesor ? r2(b.descAsesor) : 0;
      const dJ = !b.jefeCodigo || b.descJefe == null ? "" : b.aplicaJefe ? r2(b.descJefe) : 0;
      const dD = !b.directorCodigo || b.descDirector == null ? "" : b.aplicaDirector ? r2(b.descDirector) : 0;
      tA += dA || 0; tJ += dJ || 0; tD += dD || 0;
      return [
        b.asesorNombreFinal, b.tipologia || "", b.motivo || "", b.idOportunidad || "", fmtMes(b.mesOrigen), b.factNeta,
        b.tramoAsesor == null ? "" : b.tramoAsesor, dA,
        b.jefeNombreFinal || "", b.tramoJefe == null ? "" : b.tramoJefe, dJ,
        b.directorNombreFinal || "", b.tramoDirector == null ? "" : b.tramoDirector, dD,
      ];
    });
    const total = ["TOTAL (líneas marcadas)", "", "", "", "", "", "", r2(tA), "", "", r2(tJ), "", "", r2(tD)];
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows, total]);
    ws["!cols"] = [30, 22, 26, 16, 12, 12, 14, 14, 30, 14, 12, 30, 16, 14].map((w) => ({ wch: w }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Desglose de bajas");
    XLSX.writeFile(wb, `desglose_bajas_${new Date().toISOString().slice(0, 10)}.xlsx`);
  }

                  <th colSpan={3} style={{ ...styles.thc, height: 34, textAlign: "center", color: "#12302A" }}>APLICA</th>
                </tr>
                <tr>
                  <th style={{ ...styles.thc, height: 34, textAlign: "center", color: "#B01E58" }}>AC</th>
                  <th style={{ ...styles.thc, height: 34, textAlign: "center", color: "#5A36B8" }}>JE</th>
                  <th style={{ ...styles.thc, height: 34, textAlign: "center", color: "#0A6D62" }}>DV</th>
                </tr>
              </thead>
              <tbody>
                {bajasFlat.length === 0 && (
                  <tr>
                    <td style={styles.tdc} colSpan={3}></td>
                  </tr>
                )}
                {bajasFlat.map((b) => {
                  const lockStyle = { width: 15, height: 15, opacity: 0.5, cursor: "not-allowed" };
                  const lockTitle = "Baja CE: no se descuenta a nadie";
                  return (
                    <tr key={b.id} style={{ background: b.bloqueada ? "rgba(154,106,0,0.07)" : "transparent" }}>
                      <td style={{ ...styles.tdc, textAlign: "center" }}>
                        <input type="checkbox" checked={b.aplicaAsesor} disabled={b.bloqueada} onChange={(e) => toggleAplica(b.id, "asesor", e.target.checked)} style={b.bloqueada ? lockStyle : { width: 15, height: 15, accentColor: "#B01E58" }} title={b.bloqueada ? lockTitle : "Aplica al asesor"} />
                      </td>
                      <td style={{ ...styles.tdc, textAlign: "center" }}>
                        {b.jefeCodigo ? (
                          <input type="checkbox" checked={b.aplicaJefe} disabled={b.bloqueada} onChange={(e) => toggleAplica(b.id, "jefe", e.target.checked)} style={b.bloqueada ? lockStyle : { width: 15, height: 15, accentColor: "#5A36B8" }} title={b.bloqueada ? lockTitle : "Aplica al jefe de equipo"} />
                        ) : (
                          "—"
                        )}
                      </td>
                      <td style={{ ...styles.tdc, textAlign: "center" }}>
                        {b.directorCodigo ? (
                          <input type="checkbox" checked={b.aplicaDirector} disabled={b.bloqueada} onChange={(e) => toggleAplica(b.id, "director", e.target.checked)} style={b.bloqueada ? lockStyle : { width: 15, height: 15, accentColor: "#0A6D62" }} title={b.bloqueada ? lockTitle : "Aplica al director de ventas"} />
                        ) : (
                          "—"
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              {bajasFlat.length > 0 && (
                <tfoot>
                  <tr>
                    <td style={{ ...styles.tdc, borderBottom: "none", borderTop: "1.5px solid #B01E58" }} colSpan={3}></td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>

          <div style={{ ...styles.panelCyan, width: 290, flex: "0 0 290px", padding: "14px 10px" }}>
            <div style={styles.cardHead}>
              <span style={styles.dot("#0A6D62")} />
              <span style={{ ...styles.panelHeadText, color: "#0A6D62" }}>TIPOLOGÍA Y MOTIVO</span>
            </div>
            <div style={styles.cardHint}>Datos del Excel de bajas</div>
            <table style={{ ...styles.table, tableLayout: "fixed" }}>
              <colgroup>
                <col style={{ width: "46%" }} />
                <col style={{ width: "54%" }} />
              </colgroup>
              <thead>
                <tr>
                  <th style={{ ...styles.thc, height: 68, color: "#0A6D62", whiteSpace: "normal", lineHeight: 1.25 }}>TIPOLOGIA MATRICULA</th>
                  <th style={{ ...styles.thc, height: 68, color: "#0A6D62", whiteSpace: "normal", lineHeight: 1.25 }}>MOTIVO DE BAJA</th>
                </tr>
              </thead>
              <tbody>
                {bajasFlat.length === 0 && (
                  <tr>
                    <td style={styles.tdc} colSpan={2}></td>
                  </tr>
                )}
                {bajasFlat.map((b) => (
                  <tr key={b.id} style={{ background: b.bloqueada ? "rgba(154,106,0,0.07)" : "transparent" }}>
                    <td style={{ ...styles.tdc, ...(b.bloqueada ? { color: "#9A6A00", fontWeight: 700 } : {}) }} title={b.tipologia || ""}>{b.tipologia || "—"}</td>
                    <td style={styles.tdc} title={b.motivo || ""}>{b.motivo || "—"}</td>
                  </tr>
                ))}
              </tbody>
              {bajasFlat.length > 0 && (
                <tfoot>
                  <tr>
                    <td style={{ ...styles.tdc, borderBottom: "none", borderTop: "1.5px solid #0A6D62" }} colSpan={2}></td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>

          <div style={{ ...styles.panelPink, flex: 1, minWidth: 0, padding: "14px 10px" }}>
            <div style={styles.cardHead}>
              <span style={styles.dot("#B01E58")} />
              <span style={{ ...styles.panelHeadText, color: "#B01E58" }}>DESGLOSE DE BAJAS</span>
              <span style={{ ...styles.panelHeadCount, marginLeft: 8 }}>{bajasFlat.length} bajas</span>
              <button style={{ ...styles.exportBtn, marginLeft: "auto" }} onClick={exportDesglose} disabled={bajasFlat.length === 0}>
                ⬇ Exportar a Excel
              </button>
            </div>
            <div style={styles.cardHint}>Arrastra el borde de una cabecera para ajustar el ancho (doble clic para restablecer). Usa APLICAR para excluir líneas.</div>
            <table ref={tableRef} style={{ ...styles.table, tableLayout: "fixed" }}>
              <colgroup>
                {colW.map((w, i) => (
                  <col key={i} style={{ width: `${w}%` }} />
                ))}
              </colgroup>
              <thead>
                <tr>
                  {[
                    ["ASESOR", "#4B7364"], ["ID OPORT.", "#4B7364"], ["ORIGEN", "#4B7364"], ["FACT. NETA", "#4B7364"],
                    ["TR.", "#B01E58"], ["DESC. AC", "#B01E58"],
                    ["JEFE EQUIPO", "#4B7364"], ["TR.", "#5A36B8"], ["DESC. JE", "#5A36B8"],
                    ["DIRECTOR", "#4B7364"], ["TR.", "#0A6D62"], ["DESC. DV", "#0A6D62"],
                  ].map(([label, color], i) => (
                    <th key={i} style={{ ...styles.thc, height: 68, color }}>
                      {label}
                      {i < 11 && <span style={styles.resizer} onMouseDown={(e) => startResize(e, i)} onDoubleClick={resetColW} title="Arrastra para ajustar el ancho" />}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {bajasFlat.length === 0 && (
                  <tr>
                    <td style={styles.tdc} colSpan={12}>
                      Sube el Excel de bajas para ver el desglose aquí.
                    </td>
                  </tr>
                )}
                {bajasFlat.map((b) => (
                  <tr key={b.id} style={{ background: b.bloqueada ? "rgba(154,106,0,0.07)" : "transparent" }}>
                    <td style={{ ...styles.tdc, opacity: b.aplicaAsesor ? 1 : 0.4, textDecoration: b.aplicaAsesor ? "none" : "line-through" }} title={b.asesorNombreFinal}>{b.asesorNombreFinal}</td>
                    <td style={{ ...styles.tdc, fontFamily: "'IBM Plex Mono', monospace", color: "#4B7364" }}>{b.idOportunidad || "—"}</td>
                    <td style={styles.tdc}>{fmtMes(b.mesOrigen)}</td>
                    <td style={styles.tdc}>{fmtNum(b.factNeta)}</td>
                    <td style={{ ...styles.tdc, opacity: b.aplicaAsesor ? 1 : 0.4 }}><TramoChip v={b.tramoAsesor} /></td>
                    <td style={{ ...styles.tdc, color: "#B01E58", fontWeight: 600, opacity: b.aplicaAsesor ? 1 : 0.4 }}>{fmtNum(b.descAsesor)}</td>
                    <td style={{ ...styles.tdc, opacity: b.aplicaJefe ? 1 : 0.4, textDecoration: b.aplicaJefe ? "none" : "line-through" }} title={b.jefeNombreFinal || ""}>{b.jefeNombreFinal || "—"}</td>
                    <td style={{ ...styles.tdc, opacity: b.aplicaJefe ? 1 : 0.4 }}>{b.jefeCodigo ? <TramoChip v={b.tramoJefe} /> : "—"}</td>
                    <td style={{ ...styles.tdc, color: "#5A36B8", fontWeight: 600, opacity: b.aplicaJefe ? 1 : 0.4 }}>{fmtNum(b.descJefe)}</td>
                    <td style={{ ...styles.tdc, opacity: b.aplicaDirector ? 1 : 0.4, textDecoration: b.aplicaDirector ? "none" : "line-through" }} title={b.directorNombreFinal || ""}>{b.directorNombreFinal || "—"}</td>
                    <td style={{ ...styles.tdc, opacity: b.aplicaDirector ? 1 : 0.4 }}>{b.directorCodigo ? <TramoChip v={b.tramoDirector} /> : "—"}</td>
                    <td style={{ ...styles.tdc, color: "#0A6D62", fontWeight: 600, opacity: b.aplicaDirector ? 1 : 0.4 }}>{fmtNum(b.descDirector)}</td>
                  </tr>
                ))}
              </tbody>
              {bajasFlat.length > 0 && (
                <tfoot>
                  <tr>
                    <td style={{ ...styles.tdc, ...styles.tfootCell, fontWeight: 700, color: "#4B7364" }} colSpan={5}>TOTAL (LÍNEAS MARCADAS)</td>
                    <td style={{ ...styles.tdc, ...styles.tfootCell, color: "#B01E58", fontWeight: 700 }}>{fmtNum(kpis.asesores)}</td>
                    <td style={{ ...styles.tdc, ...styles.tfootCell }} colSpan={2}></td>
                    <td style={{ ...styles.tdc, ...styles.tfootCell, color: "#5A36B8", fontWeight: 700 }}>{fmtNum(kpis.jefes)}</td>
                    <td style={{ ...styles.tdc, ...styles.tfootCell }} colSpan={2}></td>
                    <td style={{ ...styles.tdc, ...styles.tfootCell, color: "#0A6D62", fontWeight: 700 }}>{fmtNum(kpis.directores)}</td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        </div>

        {enrichedBajas.length > 0 && (
          <div style={styles.row}>
            <SummaryCard title="RESUMEN POR ASESOR" color="#B01E58" panelStyle={styles.panelPink} items={asesorSummary} />
            <SummaryCard title="RESUMEN POR JEFE EQUIPO" color="#5A36B8" panelStyle={styles.panelPurple} items={jefeSummary} />
            <SummaryCard title="RESUMEN POR DIR. VENTAS" color="#0A6D62" panelStyle={styles.panelCyan} items={directorSummary} />
          </div>
        )}

        {/* DETALLE DE TRAMOS */}
        <div style={styles.panel}>
          <button style={{ ...styles.warnHead, padding: 0 }} onClick={() => setShowTramos((v) => !v)}>
            <span style={styles.dot("#0A6D62")} />
            <span style={styles.panelHeadText}>DETALLE DE TRAMOS POR ASESOR Y MES</span>
            <span style={styles.panelHeadCount}>{flatTramoRows.length} registros</span>
            <span style={{ marginLeft: 8, color: "#0A6D62" }}>{showTramos ? "−" : "+"}</span>
          </button>
          {showTramos && (
            <div style={{ ...styles.tableWrap, marginTop: 14 }}>
              <table style={styles.table}>
                <thead>
                  <tr>
                    <th style={styles.th}>MES</th>
                    <th style={styles.th}>CÓDIGO</th>
                    <th style={styles.th}>ASESOR</th>
                    <th style={styles.th}>EQUIPO</th>
                    <th style={styles.th}>FACT. NETA</th>
                    <th style={styles.th}>TRAMO</th>
                  </tr>
                </thead>
                <tbody>
                  {flatTramoRows.length === 0 && (
                    <tr>
                      <td style={styles.td} colSpan={6}>
                        Sube el Excel de tramos del mes para empezar.
                      </td>
                    </tr>
                  )}
                  {flatTramoRows.map((r) => (
                    <tr key={r.codigo + r.mes}>
                      <td style={styles.td}>{fmtMes(r.mes)}</td>
                      <td style={{ ...styles.td, fontFamily: "'IBM Plex Mono', monospace", color: "#4B7364" }}>{r.codigo}</td>
                      <td style={{ ...styles.td, color: "#12302A" }}>{r.nombre}</td>
                      <td style={styles.td}>{r.equipo || "—"}</td>
                      <td style={styles.td}>{fmtEUR(r.factNeta)}</td>
                      <td style={styles.td}>
                        <TramoChip v={r.tramo} />
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        {Object.keys(db.advisors || {}).length > 0 && (
          <button onClick={handleReset} style={styles.resetBtn}>
            Borrar histórico completo
          </button>
        )}
      </div>
    </div>
  );
}

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
