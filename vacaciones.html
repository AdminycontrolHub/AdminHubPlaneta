<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacaciones · Admin Hub</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --verde: #0e8f5b;
  --surface-1: #EAE3D7; --surface-2: #F5F0E8;
  --text-primary: #1a3a5c; --text-secondary: #4a6a8a; --text-muted: #8a9db0;
  --border: rgba(26,58,92,0.16); --border-strong: rgba(26,58,92,0.32);
  --bg-accent: rgba(0,128,200,0.12); --text-accent: #005080; --border-accent: #2f7fc0;
  --bg-warning: #FFF0C2; --text-warning: #8a5a00; --bg-danger: #FDE2E2; --text-danger: #b42318;
  --radius: 8px;
}
body { background: #0a2540; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-primary); }
.page { max-width: 1080px; margin: 0 auto; padding: 18px 16px 40px; }
.back { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 14px; padding: 7px 14px 7px 11px; border-radius: 10px; border: 1px solid rgba(0,230,255,0.35); background: rgba(0,90,130,0.15); color: #00E6FF; font-size: 13px; text-decoration: none; transition: all .2s; }
.back:hover { background: rgba(0,230,255,0.12); border-color: rgba(0,230,255,0.7); transform: translateX(-2px); }
#app { --cell: color-mix(in srgb, var(--text-primary) 9%, transparent); border-radius: 16px; background: var(--surface-2); overflow: hidden; font-size: 13px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
#app button { font-family: inherit; font-size: 12px; padding: 6px 11px; display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--text-primary); border: 0.5px solid var(--border-strong); border-radius: var(--radius); cursor: pointer; }
#app button:hover { background: var(--surface-1); }
#app input, #app select { font-family: inherit; font-size: 13px; height: 30px; padding: 0 8px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: #fff; color: var(--text-primary); }
#app input:focus, #app select:focus { outline: 2px solid var(--border-accent); outline-offset: 0; }
.ic { flex: none; }
.bar0 { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 0.5px solid var(--border); flex-wrap: wrap; background: #E8E1D5; }
.ttl { display: flex; align-items: center; gap: 8px; color: var(--verde); font-weight: 600; font-size: 16px; }
.pad { padding: 16px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 16px; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); cursor: pointer; background: transparent; color: var(--text-primary); user-select: none; }
.pill.on { background: var(--bg-accent); color: var(--text-accent); border-color: var(--border-accent); }
.pill.static { cursor: default; }
.yg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mb { border: 0.5px solid var(--border); border-radius: var(--radius); padding: 7px 8px; cursor: pointer; background: rgba(255,255,255,0.4); }
.mb:hover { border-color: var(--border-strong); }
.mb.sel { border: 1.5px solid var(--border-accent); padding: 6.5px 7.5px; }
.mb h4 { font-size: 12px; font-weight: 600; margin: 0 0 5px; }
.dg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.dg i { aspect-ratio: 1; border-radius: 2px; background: var(--cell); box-sizing: border-box; display: block; }
.dg i.wk, .tl .c.wk { background: transparent; border: 0.5px solid var(--border); }
.cl { cursor: pointer; }
.cl:hover { outline: 1.5px solid var(--text-accent); outline-offset: 0; }
.lg { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-secondary); margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); }
.lg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
.tl { display: grid; gap: 2px; align-items: center; font-size: 11px; }
.tl .c { height: 22px; border-radius: 2px; background: var(--cell); box-sizing: border-box; }
.tl .h { text-align: center; color: var(--text-secondary); letter-spacing: -.4px; }
.bar { height: 7px; border-radius: 4px; background: var(--cell); overflow: hidden; }
.bar div { height: 100%; }
.side { border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; align-self: start; font-size: 12px; background: rgba(255,255,255,0.4); }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 0.5px solid var(--border); }
.mc { background: var(--surface-1); border-radius: var(--radius); padding: 10px 12px; }
.mc b { display: block; font-size: 20px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 7px 6px; border-top: 0.5px solid var(--border); text-align: left; font-weight: 400; }
th { font-size: 11px; color: var(--text-secondary); border-top: none; }
.err { color: var(--text-danger); font-size: 12px; }
.warn { color: var(--text-warning); background: var(--bg-warning); padding: 5px 8px; border-radius: var(--radius); font-size: 12px; margin-top: 6px; }
.ok { color: var(--verde); }
.muted { color: var(--text-muted); }
.sub { color: var(--text-secondary); }
.drop { border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vl td { border-top: 1px solid #000; }
.hint { position: fixed; right: 14px; bottom: 12px; opacity: .3; cursor: pointer; font-size: 18px; background: none; border: none; }
.hint:hover { opacity: .8; }
@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
  .yg { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) { .yg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="index.html" id="backHub"></a>

  <div id="app">
    <div class="bar0">
      <div class="ttl"><span id="palm"></span><span>Vacaciones <span id="yr">2027</span></span></div>
      <span class="pill static">Equipo ADC</span>
      <span id="st" class="sub" style="font-size:11px">Cargando…</span>
      <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
        <button id="bBack" onclick="go('main')" style="display:none"></button>
        <button id="bTeam" onclick="go('team')"></button>
        <button id="bAdm" onclick="go('adm')"></button>
      </span>
    </div>

    <div id="vMain" class="pad main">
      <div>
        <div style="display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap">
          <span id="pT" class="pill on" onclick="setScope('team')">Todo el equipo</span>
          <span id="pM" class="pill" onclick="setScope('me')">Solo yo</span>
          <span style="margin-left:auto;font-size:11px" class="sub">Pulsa un día para pedirlo o quitarlo</span>
        </div>
        <div id="year" class="yg"></div>
        <div style="border-top:0.5px solid var(--border);margin-top:14px;padding-top:12px">
          <div id="mh" style="font-weight:600;font-size:14px;margin-bottom:8px"></div>
          <div id="detail"></div>
        </div>
        <div class="lg" id="lg"></div>
      </div>
      <div class="side" id="side"></div>
    </div>

    <div id="vTeam" class="pad" style="display:none"></div>
    <div id="vAdm" class="pad" style="display:none"></div>
  </div>
</div>
<button class="hint" id="hintBtn" title="Pista" style="display:none">🌠✨</button>

<script>
(function(){
// ═══ Configuración ═══
let YEAR = 2027;                         // Año por defecto. Se cambia desde Gestión de info > Año
const WORKER_URL = 'https://lucky-shadow-44ed.veronica-zueras.workers.dev';
const CFG_KEY = 'adminhub_vacaciones_config_v1';
const kvKey = () => 'adminhub_vacaciones_' + YEAR + '_v1';
const kvFileKey = () => 'adminhub_vacaciones_' + YEAR + '_adjunto_v1';
const GESTION_PASSWORD = 'AdminHub';   // Contraseña de "Gestión de info" (cámbiala aquí)
const ME_KEY = 'adminhub_vacaciones_yo';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

const C_EMP = '#85B7EB', C_VAC = '#F7E463', C_LIB = '#D63DB8', C_ORA = '#EF9F27', C_BAJ = '#E24B4A';
const MS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MON3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const TN = { v:'Vacaciones', l:'Libre disposición', b:'Baja' };
const TC = { v:C_VAC, l:C_LIB, b:C_BAJ };

// ═══ Iconos ═══
const P = {
  palm: '<path d="M12 22c.4-4 .8-8 1.4-11.5"/><path d="M13.4 10.5C12 7.5 8.5 6 5 7.5"/><path d="M13.4 10.5C10.5 9 7 10 5 13"/><path d="M13.4 10.5c1.1-3.5 4.1-5 7.6-4"/><path d="M13.4 10.5c2.6-1 5.6.5 7.1 3.5"/><path d="M13.4 10.5C13 7.5 13.5 5 15.5 3"/><path d="M8 22h8"/>',
  back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  unlock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  dl: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'
};
function ic(n, s) { s = s || 16; return '<svg class="ic" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[n] + '</svg>'; }

// ═══ Utilidades de fecha ═══
const dow = (m, d) => (new Date(YEAR, m, d).getDay() + 6) % 7;
const dim = m => new Date(YEAR, m + 1, 0).getDate();
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const $ = id => document.getElementById(id);

// ═══ Estado ═══
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
function defaultHl(y) {
  const e = easter(y), vs = new Date(e.getFullYear(), e.getMonth(), e.getDate() - 2), lp = new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1);
  return [[0,1,'Año Nuevo'],[0,6,'Reyes'],[vs.getMonth(),vs.getDate(),'Viernes Santo'],[lp.getMonth(),lp.getDate(),'Lunes de Pascua'],[4,1,'Fiesta del Trabajo'],[5,24,'San Juan'],[7,15,'La Asunción'],[8,11,'Diada de Catalunya'],[10,1,'Todos los Santos'],[11,6,'Día de la Constitución'],[11,8,'La Inmaculada'],[11,25,'Navidad'],[11,26,'San Esteban']].map(a => ({ m: a[0], d: a[1], n: a[2] }));
}
function defaults() {
  const nm = ['Ana','Elsa','Toñi','Noelia','Silvia','Verónica','Cristina'];
  return {
    people: nm.map((n, i) => ({ id: i + 1, name: n, vac: 23, lib: 4 })),
    hl: defaultHl(YEAR),
    ent: []
  };
}
let S = defaults();
let hol = {};
function rebuild() { hol = {}; S.hl.forEach(h => { hol[h.m + '-' + h.d] = h; }); }
function normalize(x) {
  const b = defaults();
  return { people: Array.isArray(x.people) ? x.people : b.people, hl: Array.isArray(x.hl) ? x.hl : b.hl, ent: Array.isArray(x.ent) ? x.ent : [] };
}
let me = 0, sel = 0, scope = 'team', view = 'main', unlocked = false, tab = 'eq', reqT = 'v', delId = null, note = '', online = true, pending = 0, detected = null, attach = null, detWarn = '';
try { me = parseInt(localStorage.getItem(ME_KEY), 10) || 0; } catch (e) {}
function defaultMonth() { const n = new Date(); return n.getFullYear() === YEAR ? n.getMonth() : (n.getFullYear() > YEAR ? 11 : 0); }
sel = defaultMonth();

const work = (m, d) => dow(m, d) < 5 && !hol[m + '-' + d];
const nd = e => { let c = 0; for (let d = e.a; d <= e.b; d++) if (work(e.m, d)) c++; return c; };
const isVero = p => /^ver[oó]nica$/i.test(String(p.name).trim());
const ordered = () => S.people.filter(p => !isVero(p)).concat(S.people.filter(isVero));
const pn = id => { const p = S.people.find(x => x.id == id); return p ? p.name : ''; };
const cover = (m, d) => S.ent.filter(e => e.m == m && d >= e.a && d <= e.b && S.people.some(p => p.id == e.p));
const used = (id, t) => S.ent.filter(e => e.p == id && e.t == t).reduce((s, e) => s + nd(e), 0);
const bg = c => c ? 'background:' + c + ';' : '';

// ═══ KV ═══
async function kvGet(key) {
  const r = await fetch(WORKER_URL + '/kv?key=' + encodeURIComponent(key));
  if (!r.ok) throw new Error('kv get ' + r.status);
  const d = await r.json();
  if (!d || d.value == null || d.value === '') return null;
  return typeof d.value === 'string' ? JSON.parse(d.value) : d.value;
}
async function kvSet(key, value) {
  const r = await fetch(WORKER_URL + '/kv', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key, value: value }) });
  if (!r.ok) throw new Error('kv set ' + r.status);
}
function setSt(t, cls) { const e = $('st'); e.textContent = t; e.className = cls || 'sub'; }
async function loadAll() {
  try {
    const cfg = await kvGet(CFG_KEY);
    if (cfg && cfg.year >= 2020 && cfg.year <= 2100) { YEAR = cfg.year; sel = defaultMonth(); }
    const f = await kvGet(kvKey());
    S = f ? normalize(f) : defaults();
    rebuild(); online = true; setSt('Sincronizado', 'sub');
  } catch (e) { online = false; rebuild(); setSt('Sin conexión con el servidor: los cambios no se guardarán', 'err'); }
  try { attach = await kvGet(kvFileKey()); } catch (e) {}
}
// Lectura antes de escritura: cada cambio se vuelve a aplicar sobre los datos frescos del servidor
let queue = Promise.resolve();
function mutate(fn) {
  fn(); rebuild(); pending++; renderAll();
  queue = queue.then(async function () {
    try {
      setSt('Guardando…', 'sub');
      const f = await kvGet(kvKey());
      if (f) { S = normalize(f); }
      fn(); rebuild();
      await kvSet(kvKey(), S);
      online = true; setSt('Guardado', 'ok');
    } catch (e) { online = false; setSt('No se ha podido guardar. Recarga la página', 'err'); }
    pending--; if (pending === 0) renderAll();
  });
}

// ═══ Operaciones idempotentes sobre S ═══
function mergeEnt() {
  S.ent.sort((a, b) => a.p - b.p || a.t.localeCompare(b.t) || a.m - b.m || a.a - b.a);
  const out = [];
  S.ent.forEach(e => {
    const l = out[out.length - 1];
    if (l && l.p == e.p && l.t == e.t && l.m == e.m) {
      let gap = true;
      for (let d = l.b + 1; d < e.a; d++) if (work(e.m, d)) { gap = false; break; }
      if (gap) { l.b = Math.max(l.b, e.b); return; }
    }
    out.push({ p: e.p, m: e.m, a: e.a, b: e.b, t: e.t });
  });
  S.ent = out;
}
function opAddDay(p, m, d, t) {
  if (S.ent.some(e => e.p == p && e.m == m && d >= e.a && d <= e.b)) return;
  S.ent.push({ p: p, m: m, a: d, b: d, t: t }); mergeEnt();
}
function opRemoveDay(p, m, d) {
  const e = S.ent.find(x => x.p == p && x.m == m && d >= x.a && d <= x.b);
  if (!e) return;
  if (e.a == e.b) S.ent.splice(S.ent.indexOf(e), 1);
  else if (d == e.a) e.a = d + 1;
  else if (d == e.b) e.b = d - 1;
  else { S.ent.push({ p: p, m: m, a: d + 1, b: e.b, t: e.t }); e.b = d - 1; }
  mergeEnt();
}
function opRemoveEntry(k) {
  S.ent = S.ent.filter(e => !(e.p == k.p && e.m == k.m && e.a == k.a && e.b == k.b && e.t == k.t));
}

// ═══ Pintado de días ═══
function dayInfo(m, d, onlyMe) {
  const h = hol[m + '-' + d];
  if (h) return { c: C_EMP, tip: h.n };
  if (dow(m, d) > 4) return { w: 1 };
  const all = cover(m, d), list = onlyMe ? all.filter(e => e.p == me) : all;
  const names = list.map(e => pn(e.p) + (e.t == 'l' ? ' (libre)' : e.t == 'b' ? ' (baja)' : '')).join(', ');
  if (list.some(e => e.t == 'b')) return { c: C_BAJ, tip: names };
  const la = list.filter(e => e.t != 'b'), away = all.filter(e => e.t != 'b').length;
  if (la.length && away >= 2) return { c: C_ORA, tip: names };
  if (la.length) return { c: la[0].t == 'l' ? C_LIB : C_VAC, tip: names };
  return { tip: '' };
}
function renderYear() {
  let h = '';
  for (let m = 0; m < 12; m++) {
    const f = dow(m, 1), n = dim(m);
    h += '<div class="mb' + (m == sel ? ' sel' : '') + '" onclick="VAC.selM(' + m + ')"><h4>' + MS[m] + '</h4><div class="dg">';
    for (let i = 0; i < f; i++) h += '<i style="background:transparent"></i>';
    for (let d = 1; d <= n; d++) {
      const x = dayInfo(m, d, scope == 'me'), click = work(m, d);
      h += '<i class="' + (x.w ? 'wk' : '') + (click ? ' cl' : '') + '" style="' + bg(x.c) + '" title="' + d + ' ' + MS[m].toLowerCase() + (x.tip ? ' · ' + esc(x.tip) : '') + '"' + (click ? ' onclick="event.stopPropagation();VAC.toggleDay(' + m + ',' + d + ')"' : '') + '></i>';
    }
    h += '</div></div>';
  }
  $('year').innerHTML = h;
}
function renderMonth() {
  const m = sel, n = dim(m);
  $('mh').textContent = MS[m] + ' ' + YEAR;
  let t = '<div class="tl" style="grid-template-columns:62px repeat(' + n + ',minmax(0,1fr))"><span></span>';
  for (let d = 1; d <= n; d++) t += '<span class="h">' + d + '</span>';
  t += '<span></span>';
  for (let d = 1; d <= n; d++) t += '<span class="h muted">' + 'LMXJVSD'[dow(m, d)] + '</span>';
  ordered().forEach((p, ix) => {
    if (isVero(p) && ix > 0) t += '<span style="grid-column:1/-1;height:1px;background:#000;margin:1px 0"></span>';
    t += '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' + (p.id == me ? 'font-weight:600' : '') + '">' + esc(p.name) + '</span>';
    for (let d = 1; d <= n; d++) {
      const k = m + '-' + d; let c = 'c', col = null, tip = '';
      const e = S.ent.find(x => x.p == p.id && x.m == m && d >= x.a && d <= x.b);
      if (hol[k]) { col = C_EMP; tip = hol[k].n; }
      else if (dow(m, d) > 4) c += ' wk';
      else if (e) {
        const away = cover(m, d).filter(x => x.t != 'b').length;
        col = e.t == 'b' ? C_BAJ : (away >= 2 ? C_ORA : (e.t == 'l' ? C_LIB : C_VAC)); tip = TN[e.t];
      }
      const mine = p.id == me && work(m, d);
      t += '<span class="' + c + (mine ? ' cl' : '') + '" style="' + bg(col) + '" title="' + d + ' ' + MS[m].toLowerCase() + (tip ? ' · ' + esc(tip) : '') + (mine ? (e ? ' · pulsa para quitar' : ' · pulsa para pedir') : '') + '"' + (mine ? ' onclick="VAC.toggleDay(' + m + ',' + d + ')"' : '') + '></span>';

function toggleDay(m, d) {

function parseR() {
  const a = $('d1').value, b = $('d2').value;
  if (!a || !b) return { err: 'Elige las dos fechas' };

  if (e < s) return { err: 'La fecha final es anterior a la inicial' };
  if (s.getFullYear() != YEAR || e.getFullYear() != YEAR) return { err: 'Elige fechas de ' + YEAR };
  const days = []; for (let x = new Date(s); x <= e; x.setDate(x.getDate() + 1)) days.push([x.getMonth(), x.getDate()]);

}

function parseTextoFestivos(txt) {

    const n = m[3].trim();
    out.push({ m: mo, d: d, n: n, on: !/noche de reyes|jornada especial/i.test(n) });
  }
  const ym = /CALENDARIO\s+(\d{4})/i.exec(txt); out.year = ym ? parseInt(ym[1], 10) : 0;
  return out;
}
async function leerPdf(file) {
  await loadScript(PDFJS); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; let txt = '';
  for (let p = 1; p <= pdf.numPages; p++) { const pg = await pdf.getPage(p); const c = await pg.getTextContent(); txt += c.items.map(i => i.str).join(' ') + ' '; }
  return parseTextoFestivos(txt);
}
function leerIcs(txt) {
  const out = [], seen = {}; const ev = txt.split('BEGIN:VEVENT').slice(1);
  ev.forEach(b => {
    const ds = /DTSTART[^:]*:(\d{4})(\d{2})(\d{2})/.exec(b), sm = /SUMMARY[^:]*:(.+)/.exec(b);
    if (!ds || parseInt(ds[1], 10) != YEAR) return;
    const m = parseInt(ds[2], 10) - 1, d = parseInt(ds[3], 10);
    if (seen[m + '-' + d]) return; seen[m + '-' + d] = 1;
    out.push({ m: m, d: d, n: sm ? sm[1].trim() : 'Día de la empresa', on: true });
  });
  return out;
}
async function leerExcel(file) {
  await loadScript(XLSX_URL);
  const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, cellDates: true });
  const out = [], seen = {};
  rows.forEach(r => {
    let dt = null, nm = '';
    (r || []).forEach(c => {
      if (!dt && c instanceof Date) dt = c;
      else if (!dt && typeof c === 'string') { const q = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(c.trim()); if (q) dt = new Date(+q[3], +q[2] - 1, +q[1]); }
      else if (typeof c === 'string' && !nm) nm = c.trim();
    });
    if (!dt || dt.getFullYear() != YEAR) return;
    const m = dt.getMonth(), d = dt.getDate(); if (seen[m + '-' + d]) return; seen[m + '-' + d] = 1;
    out.push({ m: m, d: d, n: nm || 'Día de la empresa', on: true });
  });
  return out;
}
function b64(buf) { let s = ''; const u = new Uint8Array(buf), k = 0x8000; for (let i = 0; i < u.length; i += k) s += String.fromCharCode.apply(null, u.subarray(i, i + k)); return btoa(s); }
async function onFile(inp) {
  const f = inp.files[0]; if (!f) return;
  const msg = $('cmsg'); msg.innerHTML = '<div class="sub" style="margin-bottom:8px">Leyendo ' + esc(f.name) + '…</div>';
  try {
    const ext = f.name.split('.').pop().toLowerCase(); let res;
    if (ext == 'pdf') res = await leerPdf(f);
    else if (ext == 'ics') res = leerIcs(await f.text());
    else res = await leerExcel(f);
    res.sort((a, b) => a.m - b.m || a.d - b.d);
    detected = res;
    detWarn = (res.year && res.year != YEAR) ? 'Este calendario es de ' + res.year + ': Semana Santa y otras fechas cambian cada año, así que revisa los días antes de aplicarlos' : '';
    if (f.size <= 3 * 1024 * 1024 && online) {
      try { const obj = { name: f.name, type: f.type || 'application/octet-stream', data: b64(await f.arrayBuffer()), at: new Date().toISOString() }; await kvSet(kvFileKey(), obj); attach = obj; } catch (e) { msg.innerHTML = '<div class="warn">Los días se han leído, pero no se ha podido guardar el archivo adjunto</div>'; }
    }
    if (!res.length) { detected = null; msg.innerHTML = '<div class="warn">No se han encontrado días de ' + YEAR + ' en ese archivo. Márcalos a mano en el calendario de abajo</div>'; renderAdmin(); return; }
    renderAdmin();
  } catch (e) { msg.innerHTML = '<div class="err" style="margin-bottom:8px">No se ha podido leer el archivo. Márcalos a mano en el calendario de abajo</div>'; }
}
function downloadAttach() {
  if (!attach) return;
  const bin = atob(attach.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u], { type: attach.type })); a.download = attach.name; document.body.appendChild(a); a.click(); a.remove();
}
function applyDet() {
  const sel2 = detected.filter(x => x.on), repl = $('repl').checked;
  detected = null;
  mutate(function () {
    if (repl) S.hl = [];
    sel2.forEach(x => { S.hl = S.hl.filter(h => !(h.m == x.m && h.d == x.d)); S.hl.push({ m: x.m, d: x.d, n: x.n }); });
  });
}

// ═══ Navegación ═══
function setMe(id) { me = id; note = ''; try { localStorage.setItem(ME_KEY, String(id)); } catch (e) {} renderAll(); }
function go(v) {
  view = v;
  ['Main', 'Team', 'Adm'].forEach(k => { $('v' + k).style.display = (k.toLowerCase() == v ? (k == 'Main' ? 'grid' : 'block') : 'none'); });
  $('bBack').style.display = v == 'main' ? 'none' : 'inline-flex';
  $('bTeam').style.display = v == 'main' ? 'inline-flex' : 'none';
  $('bAdm').style.display = v == 'main' ? 'inline-flex' : 'none';
  if (v == 'adm') renderAdmin(); else $('hintBtn').style.display = 'none';
}
function renderAll() { renderYear(); renderMonth(); renderSide(); renderTeam(); if (view == 'adm') renderAdmin(); }

window.VAC = {
  selM: function (m) { sel = m; renderYear(); renderMonth(); },
  toggleDay: toggleDay, addReq: addReq, prev: prev, removeEntry: removeEntry, setMe: setMe,
  setReqT: function (k) { reqT = k; note = ''; renderSide(); },
  unlock: unlock, setYear: setYear, lock: function () { unlocked = false; renderAdmin(); },
  setTab: function (k) { tab = k; renderAdmin(); },
  rename: rename, delP: delP, addP: addP, setN: setN, addH: addH, delH: delH, nameH: nameH, togH: togH,
  askDel: function (id) { delId = id; renderAdmin(); }, cancelDel: function () { delId = null; renderAdmin(); },
  onFile: onFile, downloadAttach: downloadAttach, applyDet: applyDet,
  detOn: function (i, v) { detected[i].on = v; },
  cancelDet: function () { detected = null; renderAdmin(); }
};
window.setScope = function (s) { scope = s; $('pT').className = 'pill' + (s == 'team' ? ' on' : ''); $('pM').className = 'pill' + (s == 'me' ? ' on' : ''); renderYear(); };
window.go = go;

$('backHub').innerHTML = ic('back', 16) + '<span>Admin Hub</span>';
$('palm').innerHTML = ic('palm', 24);
$('yr').textContent = YEAR;
$('bBack').innerHTML = ic('back', 14) + 'Volver al calendario';
$('bTeam').innerHTML = ic('users', 14) + 'Ver todo el equipo';
$('bAdm').innerHTML = ic('lock', 14) + 'Gestión de info';
$('hintBtn').addEventListener('click', function () { const pe = $('pe'); if (pe) pe.textContent = 'Contraseña: ' + GESTION_PASSWORD; });
rebuild(); renderLegend(); renderAll();
loadAll().then(function () { rebuild(); $('yr').textContent = YEAR; renderAll(); });
})();
